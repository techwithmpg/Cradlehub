[project]
name = "cradlehub-driver-optimizer"
version = "0.1.0"
description = "CradleHub O1 isolated Google OR-Tools fleet optimization service (local synthetic foundation)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ortools>=9.12,<9.16",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.32,<1.0",
    "pydantic>=2.10,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
