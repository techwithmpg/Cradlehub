name: Driver Home Service Hotfix QA

on:
  pull_request:
    paths:
      - "src/app/(dashboard)/staff/driver/routes/**"
      - "src/app/(dashboard)/staff/driver/map/**"
      - "src/lib/staff-pwa/driver-dispatch-policy.ts"
      - "src/components/features/staff-pwa/driver/**"
      - "src/lib/home-service/**"
      - "src/lib/bookings/crm-booking-operations.ts"
      - "src/lib/staff-pwa/notice-policy.ts"
      - "src/lib/notifications/push/delivery.ts"
      - "public/cradlehub-push-sw.js"
      - "tests/lib/home-service/confirmed-driver-notification.test.ts"
      - "tests/lib/pwa/driver-dispatch-policy.test.ts"
      - "tests/lib/notifications/cradlehub-push-service-worker.test.ts"
      - ".github/workflows/driver-home-service-hotfix-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript type-check
        run: pnpm type-check
      - name: Targeted driver / push regression tests
        run: pnpm exec vitest run tests/lib/home-service/confirmed-driver-notification.test.ts tests/lib/pwa/driver-dispatch-policy.test.ts tests/lib/notifications/cradlehub-push-service-worker.test.ts tests/lib/notifications/push-delivery-targeting.test.ts tests/lib/pwa/driver-wiring.test.ts tests/lib/pwa/driver-native-ui.test.tsx
      - name: Next.js production build
        run: pnpm build
      - name: Targeted ESLint
        run: >
          pnpm exec eslint
          src/lib/home-service/confirmed-driver-notification.ts
          src/lib/staff-pwa/driver-dispatch-policy.ts
          src/components/features/staff-pwa/driver/driver-combined-dispatch-map.tsx
          src/components/features/staff-pwa/driver/driver-screen-awake-toggle.tsx
          src/components/features/staff-pwa/driver/driver-dispatch-wake-listener.tsx
          src/components/features/staff-portal/driver/driver-mobile-shell.tsx
          tests/lib/pwa/driver-dispatch-policy.test.ts
          src/app/'(dashboard)'/staff/driver/map
          src/app/'(dashboard)'/staff/driver/routes
          src/components/features/staff-pwa/driver/driver-live-route.tsx
          src/components/features/staff-pwa/driver/driver-native-home.tsx
          src/lib/bookings/crm-booking-operations.ts
          src/lib/home-service/dispatch-operations.ts
          src/lib/staff-pwa/notice-policy.ts
          src/lib/notifications/push/delivery.ts
          tests/lib/home-service/confirmed-driver-notification.test.ts
          tests/lib/notifications/cradlehub-push-service-worker.test.ts
