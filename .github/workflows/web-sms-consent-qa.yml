name: Web SMS Consent QA (review only)

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/sms/**"
      - "src/lib/actions/online-booking.ts"
      - "src/lib/bookings/inhouse-booking-engine.ts"
      - "src/lib/validations/booking.ts"
      - "src/components/public/booking-wizard.tsx"
      - ".github/workflows/web-sms-consent-qa.yml"
  push:
    branches: [stage/web-customer-sms-consent-20261112]

permissions:
  contents: read

jobs:
  sms-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.33.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Focused SMS and public booking consent tests
        run: pnpm exec vitest run src/lib/sms/policy.test.ts src/lib/sms/consent-policy.test.ts tests/components/booking/public-details-step.test.tsx
      - name: TypeScript
        run: pnpm type-check
      - name: ESLint changed TS/TSX
        run: >
          pnpm exec eslint
          src/lib/sms/consent.ts
          src/lib/sms/consent-policy.ts
          src/lib/sms/consent-policy.test.ts
          src/lib/sms/dispatch.ts
          src/lib/validations/booking.ts
          src/lib/actions/online-booking.ts
          src/lib/bookings/inhouse-booking-engine.ts
          src/components/public/booking-wizard.tsx
      - name: Emit formatted new SMS source for correction review
        run: |
          for path in src/lib/sms/consent.ts src/lib/sms/consent-policy.ts src/lib/sms/consent-policy.test.ts; do
            printf 'SMS_FORMAT_BEGIN:%s\n' "$path"
            pnpm exec prettier "$path" | base64 -w0
            printf '\nSMS_FORMAT_END:%s\n' "$path"
          done
      - name: Format new files
        run: >
          pnpm exec prettier --check
          src/lib/sms/consent.ts
          src/lib/sms/consent-policy.ts
          src/lib/sms/consent-policy.test.ts

  sms-db-schema:
    name: Isolated PostgreSQL 17 SQL smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: sms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sms_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PG_TEST_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/sms_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify isolated PostgreSQL and test roles
        run: psql --version
      - name: Create minimal empty parent fixture
        run: psql -v ON_ERROR_STOP=1 "$PG_TEST_URL" -f supabase/tests/customer_sms_isolated_fixture.sql
      - name: Apply candidate only to ephemeral TEST database
        run: psql -v ON_ERROR_STOP=1 "$PG_TEST_URL" -f supabase/operations/customer-sms-consent-ledger-20261112-REVIEW.sql
      - name: Assert RLS and client/service role grants
        run: psql -v ON_ERROR_STOP=1 "$PG_TEST_URL" -f supabase/tests/customer_sms_consent_ledger_review.sql
      - name: Assert explicit consent, opt-out and unique delivery claim
        run: psql -v ON_ERROR_STOP=1 "$PG_TEST_URL" -f supabase/tests/customer_sms_ledger_behavior_review.sql
