name: Web P1 Booking Operations Quality

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/web-p1-booking-operations-quality.yml"
      - "src/lib/bookings/**"
      - "src/lib/validations/booking.ts"
      - "src/lib/actions/online-booking.ts"
      - "src/lib/queries/bookings.ts"
      - "src/lib/queries/crm-bookings-operational.ts"
      - "src/lib/queries/crm-today-operational.ts"
      - "src/components/features/bookings/**"
      - "src/components/features/crm/today/crm-today-shell.tsx"
      - "src/components/public/booking-wizard.tsx"
      - "src/app/(dashboard)/crm/bookings/**"
      - "src/app/api/crm/bookings/route.ts"
      - "tests/lib/bookings/**"
      - "tests/components/crm/**"
      - "scripts/database/booking-operations-readonly-audit.sql"
      - "docs/bookings/WEB-P1-BOOKING-OPERATIONS-DB-PROPOSAL-20261109.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Booking regression and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the submitted PR commit
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Booking and CRM regression tests
        run: |
          pnpm exec vitest run             tests/lib/bookings/hold-status.test.ts             tests/lib/bookings/philippine-mobile.test.ts             tests/lib/bookings/international-contact-contract.test.ts             tests/lib/bookings/crm-overdue-bookings-contract.test.ts             tests/lib/bookings/crm-order-hydration.test.ts             tests/components/crm/crm-bookings-realtime-bridge.test.tsx             tests/components/crm/bookings-generation-swr.test.tsx             tests/lib/bookings/booking-order-contract.test.ts             tests/lib/bookings/booking-payment-actions.test.ts             tests/lib/cash-flow/payment-writer-contract.test.ts             tests/lib/cash-flow/payment-ledger-concurrency.test.ts
      - name: TypeScript
        if: always()
        run: pnpm type-check
      - name: Incremental formatting gate
        if: always()
        run: pnpm format:check
      - name: Targeted ESLint
        if: always()
        run: |
          pnpm exec eslint             src/lib/bookings/hold-status.ts             src/lib/bookings/philippine-mobile.ts             src/lib/validations/booking.ts             src/lib/actions/online-booking.ts             src/lib/bookings/booking-wizard-validation.ts             src/lib/queries/bookings.ts             src/lib/queries/crm-bookings-operational.ts             src/lib/queries/crm-today-operational.ts             src/components/features/bookings/crm-bookings-view.tsx             src/components/features/bookings/bookings-desktop-workspace.tsx             src/components/features/bookings/bookings-workspace.tsx             src/components/features/crm/today/crm-today-shell.tsx             src/components/public/booking-wizard.tsx             tests/lib/bookings/crm-overdue-bookings-contract.test.ts             tests/lib/bookings/international-contact-contract.test.ts
