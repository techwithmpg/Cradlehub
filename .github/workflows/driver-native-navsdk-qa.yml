name: Android Staff Shell + Driver Navigation QA
on:
  pull_request:
    paths:
      - "native/driver-android/**"
      - "src/app/api/staff/driver/native-itinerary/**"
      - "src/app/api/staff/driver/native-travel/**"
      - "src/app/api/staff/driver/native-workspace/**"
      - "tests/lib/pwa/driver-native-connected.test.ts"
      - "tests/lib/pwa/driver-native-itinerary.test.ts"
      - "tests/lib/pwa/driver-focused-trip-ui.test.tsx"
      - "src/components/features/staff-pwa/driver/**"
      - "src/components/features/staff-portal/driver/driver-mobile-bottom-nav.tsx"
      - "src/app/(dashboard)/staff/driver/**"
      - ".github/workflows/driver-native-navsdk-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm exec vitest run tests/lib/pwa/driver-native-itinerary.test.ts tests/lib/pwa/driver-focused-trip-ui.test.tsx tests/lib/pwa/driver-wiring.test.ts tests/lib/pwa/driver-single-shell-contract.test.ts tests/lib/pwa/driver-native-connected.test.ts
      - run: pnpm exec eslint src/app/api/staff/driver/native-itinerary/route.ts tests/lib/pwa/driver-native-itinerary.test.ts tests/lib/pwa/driver-focused-trip-ui.test.tsx src/components/features/staff-pwa/driver/driver-focused-trip-route.tsx src/components/features/staff-pwa/driver/driver-native-home.tsx src/components/features/staff-pwa/driver/driver-trip-alerts.tsx

  android-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android API 36
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"
      - name: Compile and test isolated Android staff shell (no live actions)
        working-directory: native/driver-android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Retain review-only sideload APK
        uses: actions/upload-artifact@v4
        with:
          name: cradlehub-staff-android-review-apk
          path: native/driver-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
